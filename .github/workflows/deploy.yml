name: Deploy

# Put the deploy somewhere it can be seen.
#
# THE FAILURE THIS EXISTS FOR. Five commits passed CI and sat on `main` for
# hours while the API served code from four commits earlier. Every check was
# green, the repository was correct, and the product was unchanged — and from
# outside those are indistinguishable. It surfaced only because somebody asked
# the live server what it was running.
#
# That is the exact failure `deploy-check` was built to catch, and it could not
# catch it: the commit stamp read "unknown" on every deploy, so nothing could
# say "you are running old code". A deploy that happens inside a dashboard
# leaves no trace anybody else can read, including the person who has to
# diagnose it.
#
# Here, a failed deploy is a red run with a log, next to the CI run that
# approved it.
#
# INERT UNTIL A TOKEN EXISTS. With no RAILWAY_TOKEN secret this job says so and
# exits green — it never fails a build for a deployment path that has not been
# set up, and it never becomes a second way to deploy that quietly competes
# with the first.

on:
  push:
    branches: [main]
  # Deploy the current main by hand, without pushing anything.
  workflow_dispatch:

concurrency:
  # One deploy at a time, and a newer push wins. Two builds racing to replace
  # the same container is how a deploy lands older code than the one before it.
  group: deploy-production
  cancel-in-progress: true

jobs:
  railway:
    name: railway
    runs-on: ubuntu-latest
    # Never deploy code that did not pass. `needs` cannot reach across
    # workflows, so this waits for the CI run on the same commit.
    steps:
      - uses: actions/checkout@v4

      - name: Is a deploy token configured?
        id: token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy not configured"
              echo ""
              echo "No \`RAILWAY_TOKEN\` secret, so this workflow did nothing."
              echo ""
              echo "To let pushes to \`main\` deploy themselves, and to make a failed"
              echo "deploy show up here instead of only inside a dashboard:"
              echo ""
              echo "1. Railway → your project → **Settings → Tokens** → create a **project**"
              echo "   token. It must be a PROJECT token: the CLI reads a workspace or"
              echo "   account token from \`RAILWAY_API_TOKEN\` instead, so putting one in"
              echo "   \`RAILWAY_TOKEN\` authenticates as nobody and the deploy fails."
              echo "2. GitHub → this repo → **Settings → Secrets and variables → Actions**"
              echo "3. **New repository secret**, named exactly \`RAILWAY_TOKEN\`"
              echo "4. If the project has more than one service, add a repository"
              echo "   **variable** \`RAILWAY_SERVICE\` naming the backend one — otherwise"
              echo "   \`railway up\` stops with \"Multiple services found\"."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the checks that guard THIS service
        if: steps.token.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // WAIT ON WHAT PROTECTS THE BACKEND, NOT ON EVERYTHING.
            //
            // THE FAILURE THIS EXISTS FOR. This used to wait for the whole CI
            // run to conclude success. CI also runs the web browser checks and
            // the mobile bundle — so a stale check about profile pages, or a
            // Playwright timeout on a page this service does not serve, blocked
            // the API from deploying. Four such checks stacked up and the
            // backend went a full day without shipping a single fix, while the
            // frontend deployed normally through Vercel the entire time. Two
            // separate services on one shared fuse.
            //
            // Independence is the point: the API deploys when the API's own
            // gates pass. The web app has its own pipeline and its own gates,
            // and a failure in one no longer silently freezes the other.
            //
            // These two are genuinely the API's:
            //   backend     — typecheck, schema drift, and the whole test suite
            //   no db push  — nothing may reshape a database shared with
            //                 another project. Not optional, ever.
            const GUARDS = ['backend', 'no db push'];

            // NO CLOCK. IT WATCHES THE WORK INSTEAD.
            //
            // There used to be a ten-minute deadline here, written in the
            // belief that the suite took about sixteen minutes and that nobody
            // should be made to wait that long without being asked. Both halves
            // were wrong. Measured across three consecutive runs, the backend
            // job takes 8m15s, 28m29s and 8m36s — it normally finishes at about
            // NINE AND A HALF MINUTES, so a ten-minute deadline was not a
            // safeguard, it was a coin toss. The 8m36s run cleared it with
            // seconds to spare. The 28m29s run was stopped by the clock and
            // needed a person to press re-run on a job whose tests had passed —
            // and that run was slow because the runner's database was slow, not
            // because anything was wrong with the code.
            //
            // A clock cannot tell those apart. It only ever measured how long
            // something had taken, never whether it was getting anywhere.
            //
            // Khalid: "take the time limit off and get things done, but every 5
            // minutes check on the process and make sure it's not jammed or
            // stuck or failing rather than just letting it run and run ... as
            // long as you routinely check on the process and make sure it's
            // actually working not that it's still running".
            //
            // So the deadline is gone and the question changed. Every five
            // minutes this reads the running guard's own log and compares it
            // with the last look. A log that grew is a job doing work. A log
            // that has not gained a single byte across two checks — ten minutes
            // of silence, from a suite whose slowest single file takes sixty
            // seconds — is jammed, and this stops and says so.
            const HEARTBEAT_MS = 5 * 60 * 1000;

            // Between heartbeats it still asks the cheap question — have the
            // guards finished? — so a normal run is not made to wait for the
            // next five-minute mark before deploying.
            const POLL_MS = 20 * 1000;

            /** Two heartbeats of a log that has not gained a byte. */
            const SILENT_CHECKS_THAT_MEAN_JAMMED = 2;

            // AND A LIMIT ON NOT BEING ABLE TO TELL, KEPT SEPARATE ON PURPOSE.
            //
            // If the log cannot be read, that is NOT evidence the job is stuck.
            // Treating those two as one thing is exactly how a purge in this
            // codebase reported success seventeen times while deleting nothing:
            // the source refused to answer, and the refusal was read as the
            // source saying everything was fine. A FAILURE TO REACH THE
            // EVIDENCE AND THE EVIDENCE SAYING ALL IS WELL MUST NEVER LAND ON
            // THE SAME BRANCH.
            //
            // So an unreadable log keeps the wait alive and is counted on its
            // own. Half an hour of never once being able to tell is its own
            // failure, and it is reported as that rather than as a jam.
            const BLIND_CHECKS_THAT_MEAN_GIVE_UP = 6;

            /**
             * How far a running job has got, measured in bytes of log written.
             *
             * The jobs API cannot answer this: the backend's whole test suite
             * is ONE step, so its step list does not move for nine minutes and
             * a stuck job and a busy one look identical through it. The log is
             * the only thing that changes while a step is running.
             */
            async function logSize(jobId) {
              const response = await github.rest.actions.downloadJobLogsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                job_id: jobId,
              });
              const body = response.data;
              if (typeof body === 'string') return body.length;
              if (body instanceof ArrayBuffer) return body.byteLength;
              if (body && typeof body.byteLength === 'number') return body.byteLength;
              if (response.url) {
                const followed = await fetch(response.url);
                if (!followed.ok) throw new Error(`the log download answered ${followed.status}`);
                return (await followed.arrayBuffer()).byteLength;
              }
              throw new Error('the log came back in a shape this cannot measure');
            }

            let silent = 0;
            let blind = 0;
            let lastSize = null;
            let nextHeartbeat = Date.now() + HEARTBEAT_MS;
            const startedAt = Date.now();
            const minutesIn = () => Math.round((Date.now() - startedAt) / 60000);

            for (;;) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                per_page: 1,
              });
              const run = runs.data.workflow_runs[0];
              let mine = [];

              if (run) {
                const { data } = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                });
                mine = data.jobs.filter((job) => GUARDS.includes(job.name));

                // A GUARD THAT HAS ALREADY FAILED IS A DECISION.
                //
                // This used to wait for every guard to finish before looking at
                // any of them, so a `no db push` failure in the first seconds
                // still cost a full wait on the test suite before saying no.
                // Nothing about the second answer can rescue the first.
                const failed = mine.filter(
                  (job) => job.status === 'completed' && job.conclusion !== 'success',
                );
                if (failed.length) {
                  core.setFailed(
                    `Not deploying: ${failed.map((j) => `${j.name} (${j.conclusion})`).join(', ')}.`,
                  );
                  return;
                }

                // A guard that is missing is not a guard that passed. If the
                // workflow did not even start these jobs, refuse rather than
                // read "no failures" as "all clear".
                if (mine.length === GUARDS.length && mine.every((job) => job.status === 'completed')) {
                  core.info(
                    `Backend guards passed after ${minutesIn()} minute(s): ` +
                      `${mine.map((j) => j.name).join(', ')}.`,
                  );
                  return;
                }
              }

              if (Date.now() >= nextHeartbeat) {
                nextHeartbeat = Date.now() + HEARTBEAT_MS;
                const running = mine.find((job) => job.status === 'in_progress');

                if (!running) {
                  // Queued is not jammed — no runner has picked the job up, so
                  // there is nothing yet that could be stuck. It is not
                  // progress either, and something has to end this if a runner
                  // never arrives at all, so it counts as "cannot tell".
                  const where = mine.length
                    ? mine.map((j) => `${j.name}: ${j.status}`).join(', ')
                    : 'CI has not started the guard jobs yet';
                  blind += 1;
                  core.info(
                    `${minutesIn()}min check — nothing running to measure (${where}). ` +
                      `Waiting. ${blind} of ${BLIND_CHECKS_THAT_MEAN_GIVE_UP}.`,
                  );
                } else {
                  try {
                    const size = await logSize(running.id);
                    if (lastSize !== null && size <= lastSize) {
                      silent += 1;
                      core.warning(
                        `${minutesIn()}min check — "${running.name}" has written nothing new ` +
                          `(${size} bytes, unchanged since the last look). ` +
                          `${silent} of ${SILENT_CHECKS_THAT_MEAN_JAMMED} before this is called jammed.`,
                      );
                    } else {
                      if (silent > 0) core.info('It is moving again.');
                      silent = 0;
                      core.info(
                        `${minutesIn()}min check — "${running.name}" is working: log ` +
                          `${lastSize === null ? `${size}` : `${lastSize} → ${size}`} bytes.`,
                      );
                    }
                    blind = 0;
                    lastSize = size;
                  } catch (error) {
                    blind += 1;
                    core.warning(
                      `${minutesIn()}min check — could not read "${running.name}"'s log ` +
                        `(${error.message}). That is a fact about this check, not about the ` +
                        `job, so the wait continues. ${blind} of ${BLIND_CHECKS_THAT_MEAN_GIVE_UP}.`,
                    );
                  }
                }

                if (silent >= SILENT_CHECKS_THAT_MEAN_JAMMED) {
                  core.setFailed(
                    `Stopping after ${minutesIn()} minutes: the backend guard has produced no ` +
                      `output for ten minutes. The slowest single test file in that suite takes ` +
                      `sixty seconds, so this is jammed rather than slow. Nothing is known about ` +
                      `the tests themselves — this is not a test failure. Look at the CI run, ` +
                      `then re-run this job.`,
                  );
                  return;
                }

                if (blind >= BLIND_CHECKS_THAT_MEAN_GIVE_UP) {
                  core.setFailed(
                    `Stopping after ${minutesIn()} minutes: half an hour of checks and not one ` +
                      `of them could tell whether the backend guard is working — either no ` +
                      `runner ever picked it up, or its log could not be read. That is a ` +
                      `failure to find out, not a verdict on the tests. Re-run this job once ` +
                      `CI has finished and it will read the real result.`,
                  );
                  return;
                }
              }

              await new Promise((r) => setTimeout(r, POLL_MS));
            }

      - uses: oven-sh/setup-bun@v2
        if: steps.token.outputs.configured == 'true'
        with:
          bun-version: "1.3.11"

      - name: Stamp the commit into the upload
        if: steps.token.outputs.configured == 'true'
        run: |
          # THE ONLY WAY THIS BUILD CAN KNOW ITS OWN COMMIT.
          #
          # `railway up` uploads a tarball of the working directory. It is not a
          # git client and backend/.dockerignore excludes .git, so nothing in
          # the image can discover the commit, and RAILWAY_GIT_COMMIT_SHA is
          # never set on a CLI deploy — it is populated only for deploys Railway
          # makes from a repository it is connected to.
          #
          # So the commit is written into the upload itself, here, where it is
          # known. /health reads this file. Without it the version stamp reads
          # "unknown" forever and deploy-check cannot tell a shipped fix from an
          # unshipped one — which is exactly how five finished commits sat
          # unnoticed while the product looked broken.
          printf '%s\n%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > backend/BUILD_COMMIT
          echo "Stamped backend/BUILD_COMMIT:"
          cat backend/BUILD_COMMIT
          # Kept as a second route even though the service variable below is the
          # one that works. It costs nothing, it is the only thing that would
          # survive a deploy made some other way, and the runtime prefers the
          # variable over this file anyway.

      - name: Tell the service which commit it is running
        if: steps.token.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          # A SERVICE VARIABLE, NOT A FILE IN THE UPLOAD.
          #
          # The commit was first written into backend/BUILD_COMMIT for the
          # tarball to carry. It never arrived: /health kept reporting
          # "unknown" after two separate attempts, including one that removed
          # the .gitignore entry excluding it. Whatever `railway up` puts in
          # that archive, this file is not reliably in it.
          #
          # So stop depending on the archive. A service variable is set through
          # the API, is visible to the running container as an ordinary
          # environment variable, and has nothing to do with what was uploaded.
          # buildVersion() in backend/src/index.ts reads GIT_SHA before
          # anything else.
          #
          # --skip-deploys because the `up` below is the deploy; without it the
          # variable change triggers its own, and two builds racing to replace
          # one container is how a deploy lands older code than the one before.
          #
          # Tolerated if it fails: a stamp is diagnostics. It must never be the
          # reason a working fix does not ship. A failure here leaves /health
          # saying "unknown", which is the honest answer and exactly what it
          # said before.
          bunx --bun @railway/cli@latest variables \
            --set "GIT_SHA=$GITHUB_SHA" \
            --set "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --skip-deploys \
            ${RAILWAY_SERVICE:+--service "$RAILWAY_SERVICE"} \
            || echo "::warning::Could not set the commit stamp; /health will report \"unknown\" for this deploy."

      - name: Deploy
        if: steps.token.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          bunx --bun @railway/cli@latest up \
            --ci \
            --detach \
            ${RAILWAY_SERVICE:+--service "$RAILWAY_SERVICE"}

      - name: Say what was deployed
        if: steps.token.outputs.configured == 'true'
        run: |
          {
            echo "## Deployed"
            echo ""
            echo "Commit \`${GITHUB_SHA}\` was sent to Railway."
            echo ""
            echo "Railway builds asynchronously, so this succeeding means the build"
            echo "STARTED. Confirm it finished, and that the running code is this"
            echo "commit, by asking the API itself:"
            echo ""
            echo '```'
            echo "bun run deploy-check"
            echo '```'
            echo ""
            echo "or open \`/health\` and compare \`version.commit\` to \`${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
