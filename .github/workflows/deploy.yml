name: Deploy

# Put the deploy somewhere it can be seen.
#
# THE FAILURE THIS EXISTS FOR. Five commits passed CI and sat on `main` for
# hours while the API served code from four commits earlier. Every check was
# green, the repository was correct, and the product was unchanged — and from
# outside those are indistinguishable. It surfaced only because somebody asked
# the live server what it was running.
#
# That is the exact failure `deploy-check` was built to catch, and it could not
# catch it: the commit stamp read "unknown" on every deploy, so nothing could
# say "you are running old code". A deploy that happens inside a dashboard
# leaves no trace anybody else can read, including the person who has to
# diagnose it.
#
# Here, a failed deploy is a red run with a log, next to the CI run that
# approved it.
#
# INERT UNTIL A TOKEN EXISTS. With no RAILWAY_TOKEN secret this job says so and
# exits green — it never fails a build for a deployment path that has not been
# set up, and it never becomes a second way to deploy that quietly competes
# with the first.

on:
  push:
    branches: [main]
  # Deploy the current main by hand, without pushing anything.
  workflow_dispatch:

concurrency:
  # One deploy at a time, and a newer push wins. Two builds racing to replace
  # the same container is how a deploy lands older code than the one before it.
  group: deploy-production
  cancel-in-progress: true

jobs:
  railway:
    name: railway
    runs-on: ubuntu-latest
    # Never deploy code that did not pass. `needs` cannot reach across
    # workflows, so this waits for the CI run on the same commit.
    steps:
      - uses: actions/checkout@v4

      - name: Is a deploy token configured?
        id: token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy not configured"
              echo ""
              echo "No \`RAILWAY_TOKEN\` secret, so this workflow did nothing."
              echo ""
              echo "To let pushes to \`main\` deploy themselves, and to make a failed"
              echo "deploy show up here instead of only inside a dashboard:"
              echo ""
              echo "1. Railway → your project → **Settings → Tokens** → create a **project**"
              echo "   token. It must be a PROJECT token: the CLI reads a workspace or"
              echo "   account token from \`RAILWAY_API_TOKEN\` instead, so putting one in"
              echo "   \`RAILWAY_TOKEN\` authenticates as nobody and the deploy fails."
              echo "2. GitHub → this repo → **Settings → Secrets and variables → Actions**"
              echo "3. **New repository secret**, named exactly \`RAILWAY_TOKEN\`"
              echo "4. If the project has more than one service, add a repository"
              echo "   **variable** \`RAILWAY_SERVICE\` naming the backend one — otherwise"
              echo "   \`railway up\` stops with \"Multiple services found\"."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI on this commit
        if: steps.token.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // A deploy that races CI can ship a commit the tests were about to
            // reject. Poll the CI workflow for this exact sha.
            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                per_page: 1,
              });
              const run = runs.data.workflow_runs[0];
              if (run && run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(`CI concluded "${run.conclusion}" for ${context.sha}. Not deploying.`);
                }
                return;
              }
              await new Promise((r) => setTimeout(r, 20000));
            }
            core.setFailed('CI did not finish within 15 minutes. Not deploying.');

      - uses: oven-sh/setup-bun@v2
        if: steps.token.outputs.configured == 'true'
        with:
          bun-version: "1.3.11"

      - name: Stamp the commit into the upload
        if: steps.token.outputs.configured == 'true'
        run: |
          # THE ONLY WAY THIS BUILD CAN KNOW ITS OWN COMMIT.
          #
          # `railway up` uploads a tarball of the working directory. It is not a
          # git client and backend/.dockerignore excludes .git, so nothing in
          # the image can discover the commit, and RAILWAY_GIT_COMMIT_SHA is
          # never set on a CLI deploy — it is populated only for deploys Railway
          # makes from a repository it is connected to.
          #
          # So the commit is written into the upload itself, here, where it is
          # known. /health reads this file. Without it the version stamp reads
          # "unknown" forever and deploy-check cannot tell a shipped fix from an
          # unshipped one — which is exactly how five finished commits sat
          # unnoticed while the product looked broken.
          printf '%s\n%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > backend/BUILD_COMMIT
          echo "Stamped backend/BUILD_COMMIT:"
          cat backend/BUILD_COMMIT
          # Kept as a second route even though the service variable below is the
          # one that works. It costs nothing, it is the only thing that would
          # survive a deploy made some other way, and the runtime prefers the
          # variable over this file anyway.

      - name: Tell the service which commit it is running
        if: steps.token.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          # A SERVICE VARIABLE, NOT A FILE IN THE UPLOAD.
          #
          # The commit was first written into backend/BUILD_COMMIT for the
          # tarball to carry. It never arrived: /health kept reporting
          # "unknown" after two separate attempts, including one that removed
          # the .gitignore entry excluding it. Whatever `railway up` puts in
          # that archive, this file is not reliably in it.
          #
          # So stop depending on the archive. A service variable is set through
          # the API, is visible to the running container as an ordinary
          # environment variable, and has nothing to do with what was uploaded.
          # buildVersion() in backend/src/index.ts reads GIT_SHA before
          # anything else.
          #
          # --skip-deploys because the `up` below is the deploy; without it the
          # variable change triggers its own, and two builds racing to replace
          # one container is how a deploy lands older code than the one before.
          #
          # Tolerated if it fails: a stamp is diagnostics. It must never be the
          # reason a working fix does not ship. A failure here leaves /health
          # saying "unknown", which is the honest answer and exactly what it
          # said before.
          bunx --bun @railway/cli@latest variables \
            --set "GIT_SHA=$GITHUB_SHA" \
            --set "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --skip-deploys \
            ${RAILWAY_SERVICE:+--service "$RAILWAY_SERVICE"} \
            || echo "::warning::Could not set the commit stamp; /health will report \"unknown\" for this deploy."

      - name: Deploy
        if: steps.token.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          bunx --bun @railway/cli@latest up \
            --ci \
            --detach \
            ${RAILWAY_SERVICE:+--service "$RAILWAY_SERVICE"}

      - name: Say what was deployed
        if: steps.token.outputs.configured == 'true'
        run: |
          {
            echo "## Deployed"
            echo ""
            echo "Commit \`${GITHUB_SHA}\` was sent to Railway."
            echo ""
            echo "Railway builds asynchronously, so this succeeding means the build"
            echo "STARTED. Confirm it finished, and that the running code is this"
            echo "commit, by asking the API itself:"
            echo ""
            echo '```'
            echo "bun run deploy-check"
            echo '```'
            echo ""
            echo "or open \`/health\` and compare \`version.commit\` to \`${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
